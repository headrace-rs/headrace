name: release-plz

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# One release process at a time; do not cancel a release mid-flight.
concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Open (and auto-merge) the release PR: version bump + changelog from the
  # conventional commits since the last release.
  release-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: release-plz release-pr
        id: release-plz
        uses: release-plz/action@v0.13
        with:
          command: release-pr
        env:
          # A PAT (not GITHUB_TOKEN) so the eventual merge retriggers CI and the
          # release job below. See the repo secret RELEASE_PLZ_TOKEN.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - name: enable auto-merge on the release PR
        if: ${{ fromJSON(steps.release-plz.outputs.prs || '[]')[0].number }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: gh pr merge --auto --squash "${{ fromJSON(steps.release-plz.outputs.prs)[0].number }}"

  # Once the release PR is merged, tag the release. cargo-dist (release.yml) picks up
  # the tag and builds the binaries + GitHub release.
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: release-plz release
        uses: release-plz/action@v0.13
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
