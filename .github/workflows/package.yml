name: Package

# On every packaging change, lint the chart and build the image (no push) so breakage
# is caught before a release. Publishing the versioned image and chart to GHCR happens
# in the Release workflow, in the same run that cuts the release.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      pkg: ${{ steps.filter.outputs.pkg }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            pkg:
              - 'charts/**'
              - 'docker/**'
              - '.dockerignore'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/package.yml'

  validate:
    name: Lint chart and build image
    needs: changes
    if: needs.changes.outputs.pkg == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint charts/headrace
      - run: helm template charts/headrace >/dev/null
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/headrace/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
