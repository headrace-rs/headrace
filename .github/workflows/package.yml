name: Package

# On every packaging change, lint the chart and build the image (no push) so breakage
# is caught before a release. On a published release, build and push the versioned image
# and chart to GHCR - tag, chart version, and appVersion all take the release version.
# The published GHCR packages start private; make them public once to allow anonymous
# `helm pull` / `docker pull`.

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/headrace-rs/headrace
  CHART_REPO: oci://ghcr.io/headrace-rs/charts

jobs:
  changes:
    name: Detect changes
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    outputs:
      pkg: ${{ steps.filter.outputs.pkg }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            pkg:
              - 'charts/**'
              - 'docker/**'
              - '.dockerignore'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/package.yml'

  validate:
    name: Lint chart and build image
    needs: changes
    if: needs.changes.outputs.pkg == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint charts/headrace
      - run: helm template charts/headrace >/dev/null
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/headrace/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Publish image and chart
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version from the release tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the versioned image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/headrace/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.v.outputs.version }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: azure/setup-helm@v4
      - name: Package and push the chart at the release version
        run: |
          helm package charts/headrace -d dist \
            --version "${{ steps.v.outputs.version }}" \
            --app-version "${{ steps.v.outputs.version }}"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push dist/headrace-*.tgz "${{ env.CHART_REPO }}"
