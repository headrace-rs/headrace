name: Release

on:
  push:
    branches: [main]
  # Manual backfill: build and push the image and chart for a version that was already
  # released (tag + GitHub release exist) but never got its artifacts published, without
  # asking knope to cut a new release.
  workflow_dispatch:
    inputs:
      publish_version:
        description: "Already-released version to publish artifacts for, e.g. 0.1.5 (no leading v)."
        required: true
        type: string

permissions:
  contents: read

# One release at a time; do not cancel one mid-flight.
concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/headrace-rs/headrace
  CHART_REPO: oci://ghcr.io/headrace-rs/charts

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      # On push, the version comes from knope's bump; on workflow_dispatch, from the input.
      released: ${{ steps.release.outputs.released || steps.manual.outputs.released }}
      version: ${{ steps.release.outputs.version || steps.manual.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags so knope can read the commits since the last release.
          fetch-depth: 0
      - uses: knope-dev/action@v2.1.2
        if: github.event_name == 'push'
        with:
          version: 0.23.0
      - name: Configure the release identity
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      # knope bumps the version, updates the changelog, tags, and creates the GitHub
      # release from the conventional commits since the last tag. Pushing with the
      # built-in token does not retrigger this workflow, so the release event never
      # reaches a separate workflow; the publish job below runs in this same run
      # instead. `no_release` (no releasable commits since the last tag) is a normal
      # no-op, not a failure.
      - name: Release
        id: release
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          out="$(knope release 2>&1)"
          code=$?
          echo "$out"
          if [ "$code" -eq 0 ]; then
            # Read the version knope just bumped in the working tree. Do NOT derive it
            # from `git tag`: with [github] configured, knope creates the tag via the
            # GitHub API, so it never appears as a local tag in this checkout, and
            # `git tag | head` would return the *previous* release instead.
            version="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
            echo "::notice::Released v${version}."
          elif echo "$out" | grep -q 'no_release'; then
            echo "::notice::No releasable commits since the last release; nothing to do."
            echo "released=false" >> "$GITHUB_OUTPUT"
          else
            exit "$code"
          fi
      - name: Select the version for a manual backfill
        id: manual
        if: github.event_name == 'workflow_dispatch'
        run: |
          version="${{ inputs.publish_version }}"
          if ! git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "::error::No tag v${version} exists; refusing to publish an unreleased version."
            exit 1
          fi
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "::notice::Backfilling artifacts for v${version}."

  # Build and push the versioned image and chart to GHCR at the released version's tag —
  # in the same run that cut the release (push), or for a manual backfill (dispatch). The
  # published GHCR packages start private; make them public once to allow anonymous
  # `helm pull` / `docker pull`.
  publish:
    name: Publish image and chart
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the versioned image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/headrace/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ needs.release.outputs.version }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: azure/setup-helm@v4
      - name: Package and push the chart at the release version
        run: |
          helm package charts/headrace -d dist \
            --version "${{ needs.release.outputs.version }}" \
            --app-version "${{ needs.release.outputs.version }}"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push dist/headrace-*.tgz "${{ env.CHART_REPO }}"
