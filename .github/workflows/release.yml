name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# One release process at a time; do not cancel one mid-flight.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Open or update the release PR: version bump plus changelog from the conventional
  # commits since the last release. Merge it to cut a release.
  release-pr:
    name: Release PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Open the release PR
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # After the release PR is merged, tag the release and create the GitHub release.
  release:
    name: Tag and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Tag and create the GitHub release
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
