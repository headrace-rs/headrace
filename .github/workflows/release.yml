name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

# One release at a time; do not cancel one mid-flight.
concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/headrace-rs/headrace
  CHART_REPO: oci://ghcr.io/headrace-rs/charts

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags so knope can read the commits since the last release.
          fetch-depth: 0
      - uses: knope-dev/action@v2.1.2
        with:
          version: 0.23.0
      - name: Configure the release identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      # knope bumps the version, updates the changelog, tags, and creates the GitHub
      # release from the conventional commits since the last tag. Pushing with the
      # built-in token does not retrigger this workflow, so the release event never
      # reaches a separate workflow; the publish job below runs in this same run
      # instead. `no_release` (no releasable commits since the last tag) is a normal
      # no-op, not a failure.
      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          out="$(knope release 2>&1)"
          code=$?
          echo "$out"
          if [ "$code" -eq 0 ]; then
            # Read the version knope just bumped in the working tree. Do NOT derive it
            # from `git tag`: with [github] configured, knope creates the tag via the
            # GitHub API, so it never appears as a local tag in this checkout, and
            # `git tag | head` would return the *previous* release instead.
            version="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
            echo "::notice::Released v${version}."
          elif echo "$out" | grep -q 'no_release'; then
            echo "::notice::No releasable commits since the last release; nothing to do."
            echo "released=false" >> "$GITHUB_OUTPUT"
          else
            exit "$code"
          fi

  # Build and push the versioned image and chart to GHCR, in the same run that cut the
  # release, at the tag knope just created. The published GHCR packages start private;
  # make them public once to allow anonymous `helm pull` / `docker pull`.
  publish:
    name: Publish image and chart
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the versioned image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/headrace/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ needs.release.outputs.version }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: azure/setup-helm@v4
      - name: Package and push the chart at the release version
        run: |
          helm package charts/headrace -d dist \
            --version "${{ needs.release.outputs.version }}" \
            --app-version "${{ needs.release.outputs.version }}"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push dist/headrace-*.tgz "${{ env.CHART_REPO }}"

  # Build prebuilt binaries for `cargo binstall` and attach them to the release, in the
  # same run that cut it. Uses GITHUB_TOKEN, no manual setup. The asset naming
  # (headrace-<target>.tar.gz, binary at the archive root) matches
  # crates/headrace/Cargo.toml [package.metadata.binstall]. The build needs no protoc -
  # the gRPC stubs are checked in - so cross-compilation is dependency-free.
  binaries:
    name: Binary (${{ matrix.target }})
    needs: release
    if: needs.release.outputs.released == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: headrace
          target: ${{ matrix.target }}
          archive: $bin-$target
          tar: unix
          ref: refs/tags/v${{ needs.release.outputs.version }}
          token: ${{ secrets.GITHUB_TOKEN }}

  # Publish the crates to crates.io in dependency order, in the same run that cut the
  # release. DORMANT until launch - the `vars.PUBLISH_CRATES` gate keeps it off. To go
  # live: (1) manually `cargo publish` each crate once to claim the names, (2) add a
  # GitHub Actions trusted publisher for this repo + workflow on each crate's crates.io
  # settings, (3) remove the `publish = false` lines from the crate manifests, (4) set the
  # `PUBLISH_CRATES` repo variable to 'true'. Trusted publishing exchanges the OIDC token
  # for a short-lived crates.io token, so no API-token secret is stored.
  crates:
    name: Publish to crates.io
    needs: release
    if: needs.release.outputs.released == 'true' && vars.PUBLISH_CRATES == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}
      - uses: dtolnay/rust-toolchain@stable
      # cargo publish requires a version on path deps; the repo keeps them version-free
      # (so they never drift from the workspace version), so stamp the just-released
      # version into the workspace path deps here, in the ephemeral checkout.
      - name: Stamp the release version into workspace path dependencies
        run: |
          v='${{ needs.release.outputs.version }}'
          perl -0pi -e "s{(headrace-(?:ir|core|proto) = \{ path = \"[^\"]+\")}{\$1, version = \"$v\"}g" Cargo.toml
          grep -nE 'headrace-(ir|core|proto) =' Cargo.toml
      - name: Authenticate to crates.io (trusted publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          for crate in headrace-ir headrace-proto headrace-core headrace; do
            echo "::group::publish $crate"
            cargo publish -p "$crate" --locked --allow-dirty
            echo "::endgroup::"
          done
