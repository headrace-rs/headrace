name: Integration

# End-to-end tests that need Docker (spun up by testcontainers), kept out of the main CI
# job so unit tests stay fast. Runs the `#[ignore]`d integration tests with `--ignored`.
on:
  push:
    branches: [main]
    paths: ["**/*.rs", "**/Cargo.toml", "Cargo.lock", ".github/workflows/integration.yml"]
  pull_request:
    paths: ["**/*.rs", "**/Cargo.toml", "Cargo.lock", ".github/workflows/integration.yml"]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  nats:
    name: NATS backend (JetStream)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # Collect coverage from the e2e so the network glue it exercises counts; Codecov
      # merges this with the unit-test report from the CI workflow.
      - name: NATS backend end-to-end
        run: |
          cargo llvm-cov --locked -p headrace-core --features nats --test nats_e2e \
            --lcov --output-path lcov-integration.info -- --ignored --nocapture
          cargo llvm-cov report --summary-only
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov-integration.info
          token: ${{ secrets.CODECOV_TOKEN }}
