# "PNGs"/"PNG" get split by the tokenizer into `PN`, which typos wants to "correct"
# to `ON`. It is not a typo.
[default.extend-words]
PN = "PN"

# Vendored/generated web assets: minified third-party bundles and a recorded
# terminal cast. Their packed contents trip false positives (e.g. Prism's
# `lang(?:uage)?` -> `lang(?:usage)?`); never rewrite them.
[files]
extend-exclude = [
  "site/prism.js",
  "site/asciinema-player.min.js",
  "site/asciinema-player.css",
  "site/demo.cast",
]
