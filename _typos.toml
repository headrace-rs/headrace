# "PNGs"/"PNG" get split by the tokenizer into `PN`, which typos wants to "correct"
# to `ON`. It is not a typo.
[default.extend-words]
PN = "PN"

# Vendored, minified Prism build: its packed regex source trips false positives
# (e.g. `lang(?:uage)?` -> `lang(?:usage)?`). Never rewrite third-party assets.
[files]
extend-exclude = ["site/prism.js"]
