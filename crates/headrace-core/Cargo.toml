[package]
name = "headrace-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Core runtime for Headrace: IR execution, transforms, backends, OTLP, and state inspection."
keywords = ["opentelemetry", "observability", "streaming", "metrics", "otlp"]
categories = ["network-programming", "development-tools"]
readme = "README.md"

[dependencies]
headrace-ir.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
async-trait.workspace = true
humantime.workspace = true
tokio.workspace = true
tracing.workspace = true
mockall = { workspace = true, optional = true }
tonic = { workspace = true, optional = true }
opentelemetry-proto = { workspace = true, optional = true }
headrace-proto = { workspace = true, optional = true }
tonic-reflection = { workspace = true, optional = true }
tokio-stream = { workspace = true, optional = true }

[features]
# Exposes automock-generated Backend/Producer/Consumer mocks for downstream tests.
mocks = ["dep:mockall"]
# OTLP source (gRPC receiver) and sink (gRPC exporter).
otlp = ["dep:tonic", "dep:opentelemetry-proto"]
# State-inspection gRPC server (the `State` service; ADR-0014).
inspect = ["dep:tonic", "dep:headrace-proto", "dep:tonic-reflection", "dep:tokio-stream"]

[dev-dependencies]
serde_norway.workspace = true
proptest.workspace = true
tokio = { workspace = true, features = ["test-util"] }
# Drive the OTLP e2e test (otlp_e2e.rs): a real gRPC client and mock collector.
tonic.workspace = true
opentelemetry-proto.workspace = true
