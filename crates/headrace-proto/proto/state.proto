syntax = "proto3";

package headrace.v1;

// Read-only, opt-in view of a running pipeline's stateful-node state (window, join).
// See adr/0014-local-state-inspection.md. Stubs are generated by headrace-proto-gen
// and checked in; edit this file, not the generated code.
service State {
  // Snapshot the current state of the named nodes. An empty `node` list returns every
  // stateful node on this worker.
  rpc Get(GetRequest) returns (GetResponse);

  // Stream a node's snapshot each time its state changes (a record folds, a window fires,
  // a join bucket completes or is evicted). One NodeState per change, per watched node.
  rpc Watch(WatchRequest) returns (stream NodeState);
}

message GetRequest {
  // Node ids to snapshot; empty = all stateful nodes.
  repeated string node = 1;
}

message WatchRequest {
  // Node ids to watch; empty = all stateful nodes.
  repeated string node = 1;
}

message GetResponse {
  repeated NodeState nodes = 1;
}

message NodeState {
  string id = 1;
  // "window" or "join".
  string kind = 2;
  repeated GroupState groups = 3;
}

// One open window (or join bucket) for one group key.
message GroupState {
  // group_by dimension -> stringified value.
  map<string, string> labels = 1;
  uint64 window_start_nanos = 2;
  uint64 window_end_nanos = 3;
  // Window: the group's current running aggregate. Unset for a join bucket.
  optional double value = 4;
  // Join: per-input values filled so far, keyed by input id. Empty for a window.
  map<string, double> inputs = 5;
  // Window: records folded into this group so far.
  uint64 samples = 6;
}
