[package]
name = "headrace"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "OTel-native, stateful stream processing in a single Rust binary."
keywords = ["opentelemetry", "observability", "metrics", "streaming", "otlp"]
categories = ["command-line-utilities", "network-programming"]
readme = "README.md"
# Not on crates.io yet. Launch: claim the names with a manual publish, add a crates.io
# trusted publisher for the Release workflow, remove these publish = false lines, then set
# the PUBLISH_CRATES repo variable (see release.yml `crates`).
publish = false

[package.metadata.binstall]
# cargo-binstall fetches a prebuilt binary instead of compiling. The asset naming matches
# the binaries job in release.yml (headrace-<target>.tar.gz, binary at the archive root).
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.{ archive-format }"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[[bin]]
name = "headrace"
path = "src/main.rs"

[dependencies]
headrace-ir.workspace = true
headrace-core = { workspace = true, features = ["otlp", "inspect"] }
headrace-proto.workspace = true
serde_norway.workspace = true
anyhow.workspace = true
tokio.workspace = true
tonic.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
clap.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry-stdout.workspace = true
