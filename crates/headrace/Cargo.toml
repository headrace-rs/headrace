[package]
name = "headrace"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "OTel-native, stateful stream processing in a single Rust binary."
# Not on crates.io yet; flip when the CLI is published.
publish = false

[[bin]]
name = "headrace"
path = "src/main.rs"

[dependencies]
headrace-ir.workspace = true
headrace-core = { workspace = true, features = ["otlp", "inspect"] }
headrace-proto.workspace = true
serde_norway.workspace = true
anyhow.workspace = true
tokio.workspace = true
tonic.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
clap.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry-stdout.workspace = true
