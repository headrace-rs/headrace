[workspace]
resolver = "2"
members = ["crates/headrace-ir", "crates/headrace-core", "crates/headrace"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/headrace-rs/headrace"

[workspace.dependencies]
headrace-ir = { path = "crates/headrace-ir" }
headrace-core = { path = "crates/headrace-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
schemars = "0.8"
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
mockall = "0.13"
humantime = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "io-std", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
clap = { version = "4", features = ["derive"] }
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["metrics"] }
opentelemetry-otlp = { version = "0.32", features = ["metrics", "grpc-tonic"] }
opentelemetry-stdout = { version = "0.32", features = ["metrics"] }
proptest = "1"
