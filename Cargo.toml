[workspace]
resolver = "2"
members = [
    "crates/headrace-ir",
    "crates/headrace-core",
    "crates/headrace",
    "crates/headrace-proto",
    "crates/headrace-proto-gen",
]

[workspace.package]
version = "0.1.16"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/headrace-rs/headrace"

[workspace.dependencies]
headrace-ir = { path = "crates/headrace-ir", version = "0.1.16" }
headrace-core = { path = "crates/headrace-core", version = "0.1.16" }
headrace-proto = { path = "crates/headrace-proto", version = "0.1.16" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
schemars = "0.8"
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
mockall = "0.13"
humantime = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "io-std", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
clap = { version = "4", features = ["derive", "env"] }
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["metrics"] }
opentelemetry-otlp = { version = "0.32", features = ["metrics", "grpc-tonic"] }
opentelemetry-stdout = { version = "0.32", features = ["metrics"] }
opentelemetry-proto = { version = "0.32", features = ["gen-tonic", "metrics"] }
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tonic-reflection = "0.14"
tokio-stream = "0.1"
prost = "0.14"
async-nats = "0.50"
rmp-serde = "1"
bytes = "1"
proptest = "1"
