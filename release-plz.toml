# Release automation. All crates share one version (version.workspace), so we cut a
# single workspace release: one v{version} tag and one GitHub release for the binary.
# See .github/workflows/release.yml.

[workspace]
# Private until launch: no crates.io publish yet. Flip to true and add the
# CARGO_REGISTRY_TOKEN secret to start publishing.
publish = false
# One tag and release for the whole workspace, not one per crate.
git_tag_name = "v{{ version }}"

# Only the binary drives the tag and release; the libraries bump in lockstep but are
# not released or tagged on their own.
[[package]]
name = "headrace-ir"
release = false

[[package]]
name = "headrace-core"
release = false
