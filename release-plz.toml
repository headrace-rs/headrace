# Release automation. All crates share one version (version.workspace), so we cut a
# single workspace release: one v{version} tag that cargo-dist turns into a GitHub
# release with binaries. See .github/workflows/release-plz.yml and release.yml.

[workspace]
# Private until launch: no crates.io publish yet. Flip to true and add the
# CARGO_REGISTRY_TOKEN secret to start publishing.
publish = false
# One tag for the whole workspace, not one per crate.
git_tag_name = "v{{ version }}"
# cargo-dist creates the GitHub release (with binaries) from the tag, so release-plz
# must not also create one.
git_release_enable = false

# Only the binary drives the tag; the libraries bump in lockstep but are not released
# or tagged on their own. This keeps a single v{version} tag and one cargo-dist run.
[[package]]
name = "headrace-ir"
release = false

[[package]]
name = "headrace-core"
release = false
