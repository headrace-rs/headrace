# cargo-deny configuration: security advisories, license policy, and source
# allowlisting for the dependency tree. Run locally with `cargo deny check`; the CI
# `Dependencies` job runs the same check on every dependency change and on a daily
# schedule (advisories are disclosed independently of our code, so a green PR can go
# red the next day).

[advisories]
# RUSTSEC advisories. Fail on vulnerable, unsound, or unmaintained crates (the
# defaults) and on any crate resolved to a yanked version. Add crate-specific waivers
# to `ignore` with a comment justifying each; none are needed today.
yanked = "deny"
ignore = []

[licenses]
# Headrace is Apache-2.0; only permissive, redistribution-compatible licenses are
# allowed in the tree. This set is the minimum that satisfies every SPDX expression
# currently resolved - note the `AND` expressions (`MIT AND BSD-3-Clause`,
# `(MIT OR Apache-2.0) AND Unicode-3.0`, `Apache-2.0 AND ISC`) require every listed
# term to be allowed. The NATS backend adds two: `ISC` via its TLS stack (`ring`,
# `rustls-webpki`, `untrusted`) and `CDLA-Permissive-2.0` via the Mozilla CA bundle
# in `webpki-roots` - both permissive and redistribution-compatible.
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# Surface, but do not fail on, duplicate versions of a crate so dependency bloat stays
# visible without blocking unrelated work.
multiple-versions = "warn"

[sources]
# crates.io only: reject crates from unknown registries or git sources.
unknown-registry = "deny"
unknown-git = "deny"
