# Release automation. On push to main, `knope release` reads the conventional commits
# since the last tag, bumps the version, updates the changelog, tags, and creates the
# GitHub release. No PR, no manual step.
#
# All crates share one version (version.workspace), so we manage the single version in
# the root Cargo.toml ([workspace.package].version); Cargo inheritance carries it to
# every crate. crates.io publishing runs from CI (release.yml), gated behind the
# PUBLISH_CRATES variable until launch.

[package]
# Bump, in lockstep, every place the version appears: the shared
# [workspace.package].version (inherited by each crate), the [workspace.dependencies]
# path-dep versions (required by `cargo publish` and kept in sync here so they never
# drift), and each member in Cargo.lock. Miss one and `--locked` builds or publishing
# break after a bump.
versioned_files = [
    "Cargo.toml",
    { path = "Cargo.toml", dependency = "headrace-ir" },
    { path = "Cargo.toml", dependency = "headrace-record" },
    { path = "Cargo.toml", dependency = "headrace-wasm-macro" },
    { path = "Cargo.toml", dependency = "headrace-core" },
    { path = "Cargo.toml", dependency = "headrace-proto" },
    { path = "Cargo.lock", dependency = "headrace" },
    { path = "Cargo.lock", dependency = "headrace-core" },
    { path = "Cargo.lock", dependency = "headrace-ir" },
    { path = "Cargo.lock", dependency = "headrace-record" },
    { path = "Cargo.lock", dependency = "headrace-wasm-guest" },
    { path = "Cargo.lock", dependency = "headrace-wasm-macro" },
    { path = "Cargo.lock", dependency = "headrace-proto" },
    { path = "Cargo.lock", dependency = "headrace-proto-gen" },
]
changelog = "CHANGELOG.md"

# Create a GitHub release (not just a git tag) from the tag, using GITHUB_TOKEN in CI.
[github]
owner = "headrace-rs"
repo = "headrace"
